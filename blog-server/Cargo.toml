[package]
name = "blog-server"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.24.0", features = ["v7", "serde"] }
blog-proto = { path = "../blog-proto" }
actix-web = "4.14.0"
actix-web-httpauth = "0.8.2"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
actix-cors = "0.7.1"
tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "migrate"] }
dotenvy = "0.15.7"
jsonwebtoken = "11.0.0"
argon2 = "0.6.0-rc.8"
serde = "1.0.229"
serde_json = "1.0.151"
chrono = "0.4.45"
anyhow = "1.0.104"
thiserror = { version = "2.0.19", features = ["default"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "chrono", "tracing-log"] }

[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
gloo-net = { version = "0.7.0", features = ["http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.103", features = [
    "Window", "Storage", "console", "Document",
    "Element", "HtmlElement", "Request", "RequestInit",
    "Response", "Headers",
] }